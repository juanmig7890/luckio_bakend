# Blueprint de Render para el backend de LUCK.IO (servicio web).
# Las variables marcadas sync:false se piden al crear el servicio (no se guardan en el repositorio).
services:
  - type: web
    name: luckio-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: INITIAL_BALANCE
        value: 5000
      - key: ODDS_API_KEY
        sync: false
